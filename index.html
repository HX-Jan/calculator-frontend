<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="计算器" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>计算器</title>
  </head>
  <body>
    <header class="topbar">
      <div class="header-actions">
        <span id="connection" class="connection">正在连接服务</span
        ><button
          id="theme"
          class="icon-button"
          type="button"
          aria-label="切换至深色主题"
          title="切换主题"
        >
          ◐
        </button>
      </div>
    </header>
    <main class="workspace">
      <div class="layout">
        <section class="calculator card" aria-label="计算器">
          <div class="section-heading">
            <h1 class="sr-only">计算器</h1>
            <div class="mode-switch" role="group" aria-label="计算器模式">
              <button type="button" data-mode="basic" aria-pressed="true">普通</button>
              <button type="button" data-mode="scientific" aria-pressed="false">科学</button>
            </div>
            <div id="angle-switch" class="mode-switch" role="group" aria-label="角度单位" hidden>
              <button type="button" data-angle="deg" aria-pressed="true">DEG</button>
              <button type="button" data-angle="rad" aria-pressed="false">RAD</button>
            </div>
          </div>
          <form id="calculation-form" novalidate>
            <div class="display">
              <label for="expression" class="sr-only">输入表达式</label>
              <input
                id="expression"
                name="expression"
                type="text"
                inputmode="text"
                placeholder="输入算式"
                autocomplete="off"
                spellcheck="false"
                maxlength="500"
                aria-describedby="calculation-status"
              />
              <div class="result-row">
                <span id="result-label" class="sr-only">计算结果</span
                ><output id="result" aria-live="polite">0</output>
              </div>
              <div class="result-actions">
                <button type="button" id="undo-edit" title="撤销 Ctrl+Z" disabled>撤销</button>
                <button type="button" id="redo-edit" title="重做 Ctrl+Y" disabled>重做</button>
                <button type="button" id="copy-result" disabled>复制</button>
                <button type="button" id="result-format" aria-pressed="false" disabled>
                  科学计数
                </button>
              </div>
              <div id="calculation-status" class="calculation-status" role="status"></div>
            </div>
            <div id="science-keys" class="science-keys" aria-label="科学运算" hidden>
              <div class="science-toolbar">
                <button type="button" id="second-function" aria-pressed="false">2nd</button>
                <button type="button" data-memory="clear" title="清除存储">MC</button>
                <button type="button" data-memory="recall" title="读取存储">MR</button>
                <button type="button" data-memory="store" title="存储结果">MS</button>
              </div>
              <div id="science-page" class="science-page"></div>
            </div>
            <div class="keypad" aria-label="数字与运算符键盘">
              <button type="button" data-action="clear" class="key utility clear">AC</button
              ><button type="button" data-value="(" class="key utility">(</button
              ><button type="button" data-value=")" class="key utility">)</button
              ><button type="button" data-action="backspace" class="key utility" aria-label="退格">
                ⌫
              </button>
              <button type="button" data-value="7" class="key">7</button
              ><button type="button" data-value="8" class="key">8</button
              ><button type="button" data-value="9" class="key">9</button
              ><button type="button" data-value="÷" class="key operator" aria-label="除">÷</button>
              <button type="button" data-value="4" class="key">4</button
              ><button type="button" data-value="5" class="key">5</button
              ><button type="button" data-value="6" class="key">6</button
              ><button type="button" data-value="×" class="key operator" aria-label="乘">×</button>
              <button type="button" data-value="1" class="key">1</button
              ><button type="button" data-value="2" class="key">2</button
              ><button type="button" data-value="3" class="key">3</button
              ><button type="button" data-value="-" class="key operator" aria-label="减">−</button>
              <button type="button" data-value="0" class="key">0</button
              ><button type="button" data-value="." class="key">.</button
              ><button type="submit" id="calculate" class="key equals" aria-label="计算">=</button
              ><button type="button" data-value="+" class="key operator" aria-label="加">+</button>
            </div>
          </form>
          <details id="steps-panel" class="steps">
            <summary>计算步骤 <span id="step-count"></span></summary>
            <ol id="steps-list"></ol>
          </details>
        </section>
        <aside class="history card" aria-label="计算历史">
          <div class="section-heading">
            <h2>
              计算历史
              <span id="history-count" class="count">0</span>
            </h2>
            <div>
              <button type="button" id="export-history" class="text-button" disabled>
                导出本页</button
              ><button type="button" id="refresh" class="text-button">刷新</button>
            </div>
          </div>
          <form id="search-form" class="search">
            <input
              id="search"
              type="search"
              placeholder="搜索表达式或结果"
              aria-label="搜索表达式或结果"
              maxlength="500"
            /><button type="button" id="clear-search" aria-label="清除搜索" hidden>清除</button
            ><button type="submit">搜索</button>
          </form>
          <div id="history-status" class="history-status" role="status"></div>
          <div id="history-list" class="history-list"></div>
          <div class="pagination">
            <span id="page-info">第 1 / 1 页</span>
            <div>
              <button id="previous" type="button" aria-label="上一页">←</button
              ><button id="next" type="button" aria-label="下一页">→</button>
            </div>
          </div>
        </aside>
      </div>
    </main>
    <dialog id="parameter-dialog" aria-labelledby="parameter-title">
      <form id="parameter-form">
        <h2 id="parameter-title"></h2>
        <label for="parameter-first" id="parameter-first-label"></label>
        <input id="parameter-first" type="text" maxlength="240" required autocomplete="off" />
        <label for="parameter-second" id="parameter-second-label"></label>
        <input id="parameter-second" type="text" maxlength="240" required autocomplete="off" />
        <p id="parameter-error" role="status"></p>
        <div class="dialog-actions">
          <button type="button" id="parameter-cancel">取消</button
          ><button type="submit">确定</button>
        </div>
      </form>
    </dialog>
    <dialog id="delete-dialog">
      <h2>删除这条记录？</h2>
      <p id="delete-expression"></p>
      <p>删除后无法恢复，其他记录不受影响。</p>
      <div class="dialog-actions">
        <button id="cancel-delete" type="button">取消</button
        ><button id="confirm-delete" type="button" class="danger">删除记录</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
